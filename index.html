    h1{font-size:clamp(1.45rem,4vw,2rem);letter-spacing:-.03em} .sub{color:var(--muted);margin-top:4px} .year{padding:9px 13px;border:1px solid rgba(94,234,212,.28);border-radius:999px;color:var(--accent);font-size:.9rem;font-weight:600}
    .menu-section{margin-top:28px} .menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap} .menu-title{font-size:1.3rem;font-weight:700;color:var(--accent)}
    .menu-nav{display:flex;gap:10px;align-items:center} .menu-nav button{background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.28);color:var(--accent);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600} .menu-nav button:disabled{opacity:.35;cursor:not-allowed} .menu-week-label{color:var(--muted);font-size:.95rem;font-weight:600}
    .menu-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px} .menu-day-card{background:linear-gradient(180deg,rgba(24,34,64,.88),rgba(18,26,50,.92));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)} .today-highlight{border:2px solid var(--accent);box-shadow:0 0 20px rgba(94,234,212,.3),var(--shadow)}
    .menu-day-header{background:linear-gradient(135deg,rgba(94,234,212,.15),rgba(96,165,250,.12));padding:10px 12px;border-radius:10px;margin-bottom:12px;text-align:center} .menu-day-name{font-weight:700;font-size:1.05rem;color:var(--accent)} .menu-day-date{font-size:.8rem;color:var(--muted);margin-top:3px}
    .menu-option{margin-bottom:12px;padding:12px;border-radius:10px;border-left:4px solid} .menu-a{background:rgba(96,165,250,.08);border-left-color:var(--accent2)} .menu-b{background:rgba(251,146,60,.08);border-left-color:var(--accent3)} .menu-label{font-weight:700;font-size:.9rem;margin-bottom:8px} .menu-a .menu-label{color:var(--accent2)} .menu-b .menu-label{color:var(--accent3)} .menu-items{list-style:none} .menu-items li{padding:5px 0;font-size:.88rem;border-bottom:1px dashed rgba(148,163,184,.12)} .menu-items li:last-child{border-bottom:none}
    .note{margin-top:20px;padding:20px;background:linear-gradient(180deg,rgba(24,34,64,.84),rgba(18,26,50,.9));border:1px solid var(--line);border-radius:var(--radius);color:var(--muted);line-height:1.55} .note strong{color:var(--accent)} footer{color:var(--muted);font-size:.82rem;margin-top:16px}
    @media(max-width:900px){.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:720px){.wrap{width:min(100% - 24px,1280px);margin-top:20px} header{flex-direction:column;align-items:flex-start} .menu-grid{grid-template-columns:1fr} .menu-header{flex-direction:column;align-items:flex-start}}

let currentWeekIndex = 0;
const dayOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const dayNames = {Monday:'Hétfő',Tuesday:'Kedd',Wednesday:'Szerda',Thursday:'Csütörtök',Friday:'Péntek'};
const months = {'január':0,'február':1,'március':2,'április':3,'május':4,'június':5,'július':6,'augusztus':7,'szeptember':8,'október':9,'november':10,'december':11};
function dateFor(dayData, year) { const [m, d] = dayData.date.replace('.','').split(' '); return new Date(year, months[m], Number(d)); }
function findCurrentWeek() { const today = new Date(); today.setHours(0,0,0,0); for (let i=0;i<menuData.weeks.length;i++) { const w=menuData.weeks[i]; const y=Number(w.weekId.slice(0,4)); if (Object.values(w.days).some(d => dateFor(d,y).getTime()===today.getTime())) return i; } return 0; }
function escapeHtml(value) { const e=document.createElement('span'); e.textContent=value; return e.innerHTML; }
function renderMenu() { const week=menuData.weeks[currentWeekIndex]; document.getElementById('menuWeekLabel').textContent=week.weekLabel; const today=new Date(); today.setHours(0,0,0,0); const year=Number(week.weekId.slice(0,4)); document.getElementById('menuGrid').innerHTML=dayOrder.map(day => { const d=week.days[day]; const isToday=dateFor(d,year).getTime()===today.getTime(); return `<article class="menu-day-card ${isToday?'today-highlight':''}"><div class="menu-day-header"><div class="menu-day-name">${dayNames[day]}${isToday?' <small>● MA</small>':''}</div><div class="menu-day-date">${d.date}</div></div><div class="menu-option menu-a"><div class="menu-label">🅰️ A menü</div><ul class="menu-items">${d.menuA.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div><div class="menu-option menu-b"><div class="menu-label">🅱️ B menü</div><ul class="menu-items">${d.menuB.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div></article>`; }).join(''); document.getElementById('menuPrevWeek').disabled=currentWeekIndex===0; document.getElementById('menuNextWeek').disabled=currentWeekIndex===menuData.weeks.length-1; }
document.getElementById('menuPrevWeek').onclick=()=>{if(currentWeekIndex>0){currentWeekIndex--;renderMenu();}};
document.getElementById('menuNextWeek').onclick=()=>{if(currentWeekIndex<menuData.weeks.length-1){currentWeekIndex++;renderMenu();}};
currentWeekIndex=findCurrentWeek(); renderMenu();
  </script>
